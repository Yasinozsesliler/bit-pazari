let eve='hub',AU=null;
const NPCB=['@koleksiyon34','@eskici_rıza','@kartcı06','@retro_ayşe','@mezatçı','@tarihi_eşya','@antikacı_ali','@forma_avcısı'];
function val(it){let v=it.appear;if(it.cert&&it.cert.auth)v=r10(v*GMUL[it.cert.grade]);return v}
function invValue(){return S.inv.reduce((a,x)=>a+(x.chest?0:(x.known.expert&&x.fake?x.worth:val(x))),0)}
function logT(t,it,amt){(S.log=S.log||[]).push({t,n:it.n,i:it.i,amt,pl:it.pl||null,id:it.id,k:it.k||null,c:it.cond||3})}
const certTag=it=>it.cert?(it.cert.auth?`<span class="slab">ONAY ${it.cert.grade}</span>`:'<span class="chip bad">Replika</span>'):it.lab?'<span class="chip warn">Lab\'da</span>':'';
const dayStars=n=>n<=0?1:n<250?2:n<700?3:n<1400?4:5;
function renderEvening(){ensureEcon();if(eve==='kargo')return renderKargo();if(eve==='web')return renderWeb();if(eve==='bank')return renderBank();if(eve==='shop')return renderShop();if(eve==='auction')return renderAucList();if(eve==='sell')return renderSellList();if(eve==='live')return renderLive();if(eve==='lab')return renderLab();if(eve==='repair')return renderRepair();return renderEveHub()}
function renderEveHub(){ensureShip();genLots();
  const cash=S.money-S.stats.start,invNow=invValue(),invD=invNow-(S.stats.startInv||0),net=cash+invD,st=dayStars(net);
  const LBL={web:'Web mağaza',cirak:'Çırak sattı',buy:'Dükkân alış',sell:'Dükkân satış',fee:'Masraf',auc:'Mezat alış',aus:'Mezat satış'};
  const log=S.log||[];
  const rows=log.length?log.map(l=>`<div class="lrow"><span class="li">${l.k?icon({k:l.k,pl:l.pl,id:l.id||"lg",cond:l.c||3,i:l.i,known:{}}):l.i}</span><span class="ln">${esc(l.n)}<small>${LBL[l.t]||''}</small></span><b class="${l.amt>=0?'pos':'neg'}">${l.amt>=0?'+':'−'}${fmt(Math.abs(l.amt))}</b></div>`).join(''):'<p class="sub" style="margin:0">Bugün hiç alışveriş yapmadın.</p>';
  const open=S.lots.list.filter(l=>l.status==='open').length,lab=S.inv.filter(x=>x.lab).length,rp=S.inv.filter(x=>!x.lab&&!x.cert&&!x.chest&&x.cond<5).length,B=S.bank,us=unsent().length,web=S.inv.filter(x=>x.web).length,unread=Math.max(0,S.reviews.length-(S.seenRev||0));
  const R=(act,art,c,t,sub,stat,cls)=>!unlocked(act)?lockRow(art,t,act):`<button class="erow2" style="--tc:${c}" data-act="eve:${act}"><span class="ri">${ART[art]}</span><span class="rt"><b>${t}</b><small>${sub}</small></span>${stat?`<span class="rs ${cls||''}">${stat}</span>`:''}<span class="chev">›</span></button>`;
  const alerts=[];if(us)alerts.push(['warn',`${us} paket kargo bekliyor`,'kargo']);if(B.loan&&B.due-S.day<=1)alerts.push(['warn',`Kredi vadesi ${B.due-S.day<=0?'bugün':'yarın'} doluyor`,'bank']);if(unread)alerts.push(['info',`${unread} yeni mağaza yorumu`,'web']);
  return `<div class="eve eve2">
   <div class="eh2"><span class="eh2art">${ART.shutter}</span><div class="eh2l"><span class="lbl">${S.day}. GÜN SONU</span><h2>Kepenk İndi</h2>
      <div class="dstars sm">${[1,2,3,4,5].map(k=>`<i class="${k<=st?'on':''}" style="animation-delay:${.3+k*.1}s">★</i>`).join('')}</div></div>
     <div class="eh2r"><small>Net kazanç</small><b class="cnt ${net>=0?'pos':'neg'}" data-v="${net}" data-sign="1">0</b></div></div>
   <div class="sum3"><div><small>Nakit</small><b class="${cash>=0?'pos':'neg'}">${cash>=0?'+':'−'}${fmt(Math.abs(cash))}</b></div><div><small>Raf değeri</small><b class="${invD>=0?'pos':'neg'}">${invD>=0?'+':'−'}${fmt(Math.abs(invD))}</b></div><div><small>Kasa</small><b>${fmt(S.money)}</b></div></div>
   ${alerts.length?`<div class="alerts">${alerts.map(a=>`<button class="al ${a[0]}" data-act="eve:${a[2]}"><i></i>${a[1]}<span>›</span></button>`).join('')}</div>`:''}
   ${marketLine()}${ordersSec()}
   <section class="grp"><h3>Satış</h3>
    ${R('auction','mezat','#c23a2f','Online Mezat','Teklif ver, mal sat',open?`${open} açık`:'Bitti')}
    ${R('web','web','#5fd1b8','Web Mağazam','Sabit fiyatla sat',unread?`${unread} yeni yorum`:web?`${web} ilan`:'İlan ver',unread?'info':'')}
    ${R('kargo','kargo','#e8925a','Kargo Masası','Paketle ve gönder',us?`${us} paket`:'Boş',us?'warn':'')}</section>
   <section class="grp"><h3>Atölye</h3>
    ${R('lab','lab','#5fb0f0','ONAY Lab','Sertifikayla değer kat',lab?`${lab} bekliyor`:'')}
    ${R('repair','tamir','#9aa1a8','Tamir Atölyesi','Yıpranmış malı onar',rp?`${rp} ürün`:'')}</section>
   <section class="grp"><h3>İşletme</h3>
    ${R('bank','banka','#e8ab3c','Çarşı Bankası','Birikim ve kredi',B.loan?`Borç ${fmt(B.loan)}`:B.sav?fmt(B.sav):'',B.loan&&B.due-S.day<=1?'warn':'')}
    ${R('shop','dukkan','#78d1a2','Dükkân ve Görünüm','Geliştir, süsle',`${S.inv.length}/${invCap()} raf`)}
    <button class="erow2" style="--tc:#5fb0f0" data-act="mapOpen"><span class="ri" style="font-size:22px">🗺️</span><span class="rt"><b>Şehir Haritası</b><small>${curLoc().n}${S.nextLoc?' → yarın '+LOCS.find(l=>l.id===S.nextLoc).n:''}</small></span><span class="rs">${(S.locs||['bit']).length}/${LOCS.length}</span><span class="chev">›</span></button></section>
   <details class="ledger2"${S.ledOpen?' open':''}><summary data-act="ledger"><span>Günün Defteri</span><em>${log.length} işlem</em><i class="chev">›</i></summary><div class="ledger">${rows}</div></details>
   <div class="kepenkWrap">${kepenkBtn()}</div></div>`}
function countUps(){document.querySelectorAll('.cnt').forEach(el=>{const v=+el.dataset.v,sg=el.dataset.sign,t0=performance.now();
  (function st(t){const k=Math.min(1,(t-t0)/900),x=v*(1-Math.pow(1-k,3));el.textContent=(sg&&v>0?'+':v<0?'−':'')+fmt(Math.abs(x));if(k<1)requestAnimationFrame(st)})(t0)})}

/* auctions */
function genLots(){if(S.lots&&S.lots.day===S.day)return;
  S.lots={day:S.day,sold:0,list:[0,1,2].map(()=>{const sp=R()<.55;const cat=pick(CAT.filter(c=>sp?c.sp:!c.sp));const rating=+rf(2.4,5).toFixed(1);
    const it=newItem(cat,{fake:!!cat.f&&R()<(5-rating)/5*.9});return{id:uid(),it,rating,start:r10(it.appear*rf(.3,.5)),status:'open',user:pick(NPCB),rival:S.day>=3&&R()<.35}})};save()}
function tabletWrap_old(inner,tab){return `<div class="eve"><div class="tablet"><div class="tcam"></div><div class="tscreen">
  <div class="tbar"><span class="tlogo">e<b>Mezat</b></span><span class="tclock">${S.day}. gün · 21:4${S.day%10} · ▮▮▮</span></div>
  <div class="ttabs"><button class="${tab==='buy'?'on':''}" data-act="eve:auction">Açık Artırmalar</button><button class="${tab==='sell'?'on':''}" data-act="eve:sell">Mal Sat</button></div>
  <div class="tbody">${inner}</div></div></div>
  <button class="b ghost" data-act="eve:hub">Akşam İşlerine Dön</button></div>`}
function renderAucList_old(){genLots();
  return tabletWrap(S.lots.list.map(l=>`<div class="lot"><div class="lic">${icon(l.it)}</div><div class="ltx"><b>${l.it.n}</b><span><span class="stars">${stars(l.it.cond)}</span> · ${l.user} ★${l.rating}</span>${l.rating<3.4?'<em class="lwarn">Fotoğraflar bulanık</em>':''}</div>
   <div class="lr">${l.status==='open'?`<small>Açılış</small><b>${fmt(l.start)}</b><button class="tb" data-act="lot:${l.id}">Katıl</button>`:l.status==='won'?'<span class="tchip win">Kazandın</span>':'<span class="tchip">Kapandı</span>'}</div></div>`).join('')
   +'<p class="tnote">Satıcı puanı düşükse ürünün sahte çıkma ihtimali yüksek. Kazandığın ürünler rafına gelir. Son saniyelerde gelen teklif süreyi uzatır.</p>','buy')}
const inc=b=>Math.max(10,stepOf(b)*2);
function startLot(id){genLots();const l=S.lots.list.find(x=>x.id===id);if(!l||l.status!=='open')return;const now=performance.now();
  AU={mode:'buy',l,bid:l.start,leader:'—',you:false,dur:15000,end:now+15000,npcMax:r10(l.it.appear*rf(.7,1.12)*(has('m2')?.93:1)*(l.rival?1.2:1)),feed:[],nextNpc:now+rf(1200,2200),done:false};
  eve='live';sfx.door();render();AU.tk=setInterval(auTick,100)}
function startSell(id){const it=itemById(id);if(!it)return;genLots();if(S.lots.sold>=sellCap()){toast('Bu akşam en fazla '+sellCap()+' mal satabilirsin');return}
  const v=it.known.expert&&it.fake?it.worth:val(it);const now=performance.now();
  AU={mode:'sell',it,bid:r10(v*.35),leader:'—',you:false,final:r10(v*locBuy()*trendMul(it)*evBuyMul()*serBonus(it)*(has('k1')&&isSp(it)?1.15:1)*rf(.75,1.35)*(.85+S.rep/333)*rateMul()),dur:9000,end:now+9000,feed:[],nextNpc:now+900,done:false};
  if(R()<.12)AU.final=0;
  eve='live';sfx.door();render();AU.tk=setInterval(auTick,100)}
function auBid(mm){mm=mm||1;if(!AU||AU.done||AU.mode!=='buy'||AU.you)return;if(S.inv.length>=invCap()){toast(fullMsg());sfx.bad();return}const nb=AU.leader==='—'?AU.bid:AU.bid+inc(AU.bid)*mm;
  if(nb>S.money){toast('Kasada yeterli para yok');sfx.bad();return}
  AU.bid=nb;AU.you=true;AU.leader='Sen';AU.feed.unshift({w:'Sen',v:nb});tone(880,.06,'triangle',.05);buzz(15);
  if(AU.end-performance.now()<4000)AU.end+=3000;AU.nextNpc=performance.now()+rf(700,1600);auPaint()}
function auTick(){if(!AU)return;const now=performance.now();
  if(!AU.done&&now>=AU.nextNpc){
    if(AU.mode==='buy'){if(AU.you||AU.leader==='—'){const nb=AU.leader==='—'?AU.bid:AU.bid+inc(AU.bid);
        if(nb<=AU.npcMax&&R()<.75){AU.bid=nb;AU.you=false;AU.leader=AU.l.rival&&R()<.65?RIVAL:pick(NPCB);if(AU.leader===RIVAL&&!AU.taunt){AU.taunt=1;toast('😼 Cemil: "'+pick(RIVT)+'"')}AU.feed.unshift({w:AU.leader,v:nb});if(AU.end-now<4000)AU.end+=2500;tone(380,.06,'triangle',.04)}}
      AU.nextNpc=now+rf(800,1900)}
    else{if(AU.final&&AU.bid<AU.final){const nb=AU.leader==='—'?AU.bid:Math.min(AU.final,r10(AU.bid+Math.max(inc(AU.bid),(AU.final-AU.bid)*rf(.15,.4))));
        if(AU.leader==='—'||nb>AU.bid){AU.bid=nb;AU.leader=pick(NPCB);AU.feed.unshift({w:AU.leader,v:nb});tone(620,.06,'triangle',.04);if(AU.end-now<2500)AU.end+=1500}}
      AU.nextNpc=now+rf(500,1200)}}
  if(!AU.done&&now>=AU.end)auEnd();else auPaint()}
function auEnd(){AU.done=true;clearInterval(AU.tk);
  if(AU.mode==='buy'){const l=AU.l;if(AU.you){l.status='won';const it=l.it;S.money-=AU.bid;it.paid=AU.bid;it.isNew=true;S.inv.push(it);colAdd(it);stat('buy');stat('aucWin');logT('auc',it,-AU.bid);sfx.cash();AU.result='win';gainXP(15);if(l.rival){S.rival.w++;setTimeout(()=>toast('😼 Cemil\'i alt ettin!'),400)}}
    else{l.status='lost';AU.result='lost';sfx.bad();if(l.rival&&AU.leader===RIVAL)S.rival.l++}}
  else{const it=AU.it;if(AU.leader==='—'){AU.result='unsold';sfx.bad()}
    else{const net=r10(AU.bid*(1-commis()/100));S.money+=net;S.inv=S.inv.filter(x=>x.id!==it.id);S.lots.sold++;logT('aus',it,net);stat('aucSell');S.st.bestProfit=Math.max(S.st.bestProfit||0,net-it.paid);AU.net=net;AU.result='sold';if(net-it.paid>=Math.max(400,it.paid*.6))setTimeout(()=>burst(),200);shipNew(it,AU.leader,AU.bid,'mezat');gainXP(15+Math.max(0,net-it.paid)/15);sfx.cash();
      if(it.fake&&!it.cert&&R()<.5)S.pending.push({n:it.n,i:it.i,fine:r10(AU.bid*1.2),rep:6})}}
  save();render()}
function renderLive_old(){const a=AU;if(!a){eve='auction';return renderAucList()}const it=a.mode==='buy'?a.l.it:a.it;let res='';
  if(a.done){const back=a.mode==='buy'?'auction':'sell';
    const m={win:['win','Kazandın!',`${it.n} artık senin. ${fmt(a.bid)} kasadan çıktı, ürün rafında.`],
      lost:['lose','Kaçırdın',a.leader==='—'?'Teklif vermedin, mezat kapandı.':`${a.leader} son anda kaptı: ${fmt(a.bid)}.`],
      sold:['win','Satıldı!',`${a.leader} ${fmt(a.bid)} ile aldı. %${commis()} komisyon sonrası kasaya ${fmt(a.net)} girdi.`],
      unsold:['lose','Alıcı çıkmadı','Kimse teklif vermedi. Ürün rafında kaldı.']}[a.result];
    res=`<div class="res ${m[0]}"><b>${m[1]}</b><p>${m[2]}</p><button class="tb" data-act="eve:${back}">Tamam</button></div>`}
  return tabletWrap(`<div class="live"><div class="lvTop"><span class="livedot">CANLI</span><span id="auT" class="auT">—</span></div>
    <div class="lvItem">${icon(it)}</div><h3 class="lvName">${it.n}</h3>
    <div class="lvMeta"><span class="stars">${stars(it.cond)}</span>${a.mode==='buy'?` · ${a.l.user} ★${a.l.rating}`:''} ${certTag(it)}</div>
    <div class="tbarw"><i id="auBar"></i></div>
    <div class="lvBid"><small>${a.mode==='buy'?'Güncel teklif':'En yüksek teklif'}</small><b id="auBid">${fmt(a.bid)}</b><span id="auLead" class="lead">—</span></div>
    <div class="feed" id="auFeed"></div>
    ${a.done?res:(a.mode==='buy'?`<div class="btns"><button class="tb ghost" data-act="auQuit">Çekil</button><button class="tb big" id="auBtn" data-act="auBid">Teklif Ver</button></div>`:'<p class="tnote">Alıcılar teklif veriyor… Satış bedelinden %${commis()} komisyon kesilir.</p>')}</div>`,a.mode)}
function auPaint_old(){if(!AU)return;const t=$('#auT');if(!t)return;const left=Math.max(0,AU.end-performance.now());
  t.textContent=AU.done?'Bitti':(left/1000).toFixed(1)+' sn';t.classList.toggle('hot',!AU.done&&left<4000);
  const bar=$('#auBar');if(bar)bar.style.width=Math.min(100,left/AU.dur*100)+'%';
  const bd=$('#auBid'),bt=fmt(AU.bid);if(bd.textContent!==bt)bd.textContent=bt;const ld=$('#auLead'),lt=AU.leader==='—'?'Henüz teklif yok':'Önde: '+AU.leader;if(ld.textContent!==lt){ld.textContent=lt;ld.className='lead'+(AU.you?' you':'')}
  const fd=$('#auFeed');if(fd&&fd.dataset.n!==String(AU.feed.length)){fd.dataset.n=AU.feed.length;fd.innerHTML=AU.feed.slice(0,4).map(f=>`<div class="${f.w==='Sen'?'me':''}"><span>${f.w}</span><b>${fmt(f.v)}</b></div>`).join('')}
  const btn=$('#auBtn');if(btn){const key=AU.you+'|'+AU.bid+'|'+AU.leader;if(btn.dataset.k!==key){btn.dataset.k=key;btn.disabled=AU.you;btn.classList.toggle('lead',AU.you);
    btn.innerHTML=AU.you?'Önde sensin<small>bekle ya da izle</small>':`Teklif Ver<small>${fmt(AU.leader==='—'?AU.bid:AU.bid+inc(AU.bid))}</small>`}}}
function renderSellList_old(){genLots();const items=S.inv.filter(x=>!x.lab&&!x.chest);
  return tabletWrap((items.length?items.map(x=>`<div class="lot"><div class="lic">${icon(x)}</div><div class="ltx"><b>${x.n}</b><span><span class="stars">${stars(x.cond)}</span> · Ödenen ${fmt(x.paid)}</span> ${certTag(x)}</div>
    <div class="lr"><button class="tb" data-act="sellLot:${x.id}" ${S.lots.sold>=sellCap()?'disabled':''}>Mezata Koy</button></div></div>`).join(''):'<p class="tnote">Satacak malın yok. Gündüz müşterilerden ya da mezattan mal al.</p>')
    +`<p class="tnote">Bu akşam ${Math.max(0,sellCap()-S.lots.sold)} satış hakkın kaldı. ONAY sertifikalı ürünler mezatta çok daha iyi gider. Sahte ürün satarsan alıcı şikâyet edebilir.</p>`,'sell')}

/* lab */
const labFee=x=>r10(Math.max(80,val(x)*.08)*(has('e4')?.5:1));
const erow=(x,right)=>`<div class="erow"><span class="ic">${icon(x)}</span><span class="tx"><b>${x.n}</b><small>${CONDN[x.cond-1]} · Ödenen ${fmt(x.paid)}</small></span>${right}</div>`;
function renderLab(){const inLab=S.inv.filter(x=>x.lab),can=S.inv.filter(x=>!x.lab&&!x.cert&&!x.chest&&x.k!=='anahtar');
  return `<div class="eve"><div class="labHead"><div class="slabBig"><div class="sl1">ONAY LAB</div><div class="sl2">10</div><div class="sl3">KUSURSUZ · ORİJİNAL</div><div class="slwin">🃏</div></div>
   <div style="min-width:0"><h2 class="h">ONAY Lab</h2><p class="sub" style="margin:0">Ürünü uzmanlara gönder. Orijinalse 1–10 arası not ve mühürlü kutu alır, değeri artar. Sahteyse ortaya çıkar. Sonuç ertesi sabah gelir.</p></div></div>
   ${inLab.length?`<div class="ecard"><h3 class="eh">Laboratuvarda</h3>${inLab.map(x=>erow(x,'<span class="chip warn">Yarın sabah</span>')).join('')}</div>`:''}
   <div class="ecard"><h3 class="eh">Gönderilebilir</h3>${can.length?can.map(x=>erow(x,`<button class="b teal sm" data-act="lab:${x.id}">Gönder<small>${fmt(labFee(x))}</small></button>`)).join(''):'<p class="sub" style="margin:0">Gönderilecek ürün yok.</p>'}</div>
   <p class="sub" style="margin:0">İmzalı kartlar, formalar ve spor hatıraları sertifikayla en çok değer kazanan ürünler. Not 10 alan ürün değerini 1,8 katına çıkarır.</p>
   <button class="b ghost" data-act="eve:hub">Akşam İşlerine Dön</button></div>`}
function sendLab(id){const x=itemById(id);if(!x)return;delete x.web;const f=labFee(x);if(S.money<f){toast('Kasada yeterli para yok');sfx.bad();return}
  S.money-=f;x.lab=true;logT('fee',{n:'ONAY Lab: '+x.n,i:'🔬'},-f);sfx.ok();toast('Kargoya verildi. Sonuç yarın sabah.');save();render()}
function labResults(){const out=[];S.inv.filter(x=>x.lab).forEach(it=>{it.lab=false;it.known.expert=true;it.known.insp=true;
  if(it.fake){it.cert={auth:false,grade:0};it.known.suspect=true;it.known.lo=it.known.hi=it.worth;out.push(`${icon(it)} <b>${it.n}</b>: REPLİKA çıktı. Sertifika verilmedi.`)}
  else{const g=clamp(Math.round(it.cond*2-rf(0,2.6)+.8)+(has('e4')?1:0),1,10);gainXP(10);it.cert={auth:true,grade:g};stat('cert');if(g===10)stat('g10');it.known.suspect=false;it.known.lo=it.known.hi=val(it);out.push(`${icon(it)} <b>${it.n}</b>: Orijinal, <b>ONAY ${g}</b>. Yeni değeri ${fmt(val(it))}.`)}});return out}

/* repair */
const repCost=x=>r10(Math.max(40,x.appear*.18)*(has('a2')?.6:1)*(has('k2')&&WATCH.has(x.k)?.5:1)),repChance=x=>has('k2')&&WATCH.has(x.k)?1:Math.min(.97,(x.cond===1?.7:.85)+(has('a1')?.1:0));
/* ---------- Elle restorasyon ---------- */
let RS=null;
const rsFee=x=>r10(Math.max(20,repCost(x)*.3));
function condUp(x,n){for(let q=0;q<n&&x.cond<5;q++){const ratio=COND[x.cond]/COND[x.cond-1];x.cond++;x.appear=r10(x.appear*ratio);x.worth=x.fake?r10(x.appear*.08):x.appear;
  if(x.known.insp){x.known.lo=r10(x.known.lo*ratio);x.known.hi=r10(x.known.hi*ratio)}}}
function rsOpen(id){const x=itemById(id);if(!x)return;if(x.diy===S.day){toast('Bu parçayla bugün zaten uğraştın. Yarın tekrar dene.');sfx.bad();return}
  const fee=rsFee(x);if(S.money<fee){toast('Malzeme parası yok');sfx.bad();return}
  S.money-=fee;logT('fee',{n:'Malzeme: '+x.n,i:'🧴'},-fee);x.diy=S.day;save();
  const cracks=Math.max(0,4-x.cond);
  const el=document.createElement('div');el.className='rsx';el.id='rs';

function bankAct(a){const B=S.bank;let v=bankAmt;
  if(a==='dep'){v=Math.min(v,S.money);if(v<=0)return;S.money-=v;B.sav+=v;toast(fmt(v)+' birikime yatırıldı')}
  else if(a==='wd'){v=Math.min(v,B.sav);if(v<=0)return;B.sav-=v;S.money+=v;toast(fmt(v)+' kasaya çekildi')}
  else if(a==='pay'){v=Math.min(v,B.loan,S.money);if(v<=0)return;S.money-=v;B.loan-=v;logT('fee',{n:'Kredi ödemesi',i:'🏦'},-v);if(B.loan<=0){B.loan=0;B.due=0;stat('loanPaid');addRep(3);toast('Borç kapandı! Bankanın gözünde itibarın arttı.')}else toast(fmt(v)+' ödendi')}

  if(has('f4')){S.money+=250;logT('sell',{n:'Üst kat kirası',i:'🏠'},250);out.push('🏠 Üst kattaki kiracından <b>250 ₺</b> kira geldi.')}
  if(B.sav>0){const f=Math.max(1,Math.round(B.sav*(has('f1')?.02:.01)));B.sav+=f;out.push(`🏦 Birikimine <b>${fmt(f)}</b> faiz eklendi.`)}
  if(B.loan>0){const f=Math.max(1,Math.round(B.loan*(has('f2')?.015:.03)));B.loan+=f;
    if(S.day>B.due){let need=B.loan;const fromCash=Math.min(need,Math.max(0,S.money));S.money-=fromCash;need-=fromCash;const fromSav=Math.min(need,B.sav);B.sav-=fromSav;need-=fromSav;let seized=[];
      if(need>0){const its=S.inv.filter(x=>!x.lab).sort((a,b)=>val(b)-val(a));for(const it of its){if(need<=0)break;need-=r10(val(it)*.6);seized.push(it.n);S.inv=S.inv.filter(x=>x.id!==it.id)}}

/* morning */
function shipMorning(){ensureShip();const out=[],keep=[];
  for(const o of S.ship){
    if(o.sent){if(S.day<o.arrive){keep.push(o);continue}
      const f=FIRMS.find(x=>x.id===o.firm)||FIRMS[1];const fr=FRAG.has(o.it.k);const dmgP=f.dmg*(fr?2.5:1)*(1.25-o.q);const damaged=R()<dmgP;
      let st=5,txt;const fake=o.it.fake&&!(o.it.cert&&o.it.cert.auth);
      if(fake){st=1;txt=pick(['Replika çıktı! Kimse almasın.','Sahte ürün gönderilmiş, rezalet.'])}
      else if(damaged){st=2;txt=pick(['Paket ezik geldi, ürün hasarlı.','Ürün kırık çıktı, çok üzüldüm.']);const rf2=r10(o.price*.5);S.money-=rf2;out.push(`📦 <b>${o.it.n}</b> hasarlı ulaştı. Alıcıya ${fmt(rf2)} iade ettin.`)}
      else{if(o.q<.6){st--;txt='Ürün güzel ama paketleme özensizdi.'}
        if(o.late){st-=o.late;txt=txt||'Kargo çok geç gönderildi.'}
        if(f.eta>1&&!o.late){st-=R()<.5?1:0;txt=txt||(st<5?'Kargo biraz yavaş geldi ama ürün iyi.':null)}
        if(o.it.cond<=1&&R()<.6){st--;txt=txt||'Durumu anlatılandan kötüydü.'}
        st=clamp(st,1,5);txt=txt||pick(f.id==='kurye'?['Aynı gün geldi, harika hizmet!','Kurye kapıdaydı, mükemmel!']:['Harika paketlenmişti, ürün tam anlatıldığı gibi!','Güvenilir satıcı, tekrar alırım.','Ürün fotoğraftakinden bile güzel.','Özenli paketleme, teşekkürler usta!'])}
      if(st===5){stat('five');addRep(1)}if(st<=1)addRep(-1);S.reviews.push({s:st,t:txt,n:o.buyer,ch:o.ch,day:S.day,item:o.it.n});gainXP(st>=4?8:2);
      out.push(`${'★'.repeat(st)}${'☆'.repeat(5-st)} <b>${esc(o.buyer)}</b>: “${txt}”`);continue}
    o.late++;
    if(o.late>=2){S.money-=o.price;S.inv.push(o.it);S.reviews.push({s:1,t:'Ürün hiç gönderilmedi, param iade edildi.',n:o.buyer,ch:o.ch,day:S.day,item:o.it.n});addRep(-5);
      out.push(`❌ <b>${o.it.n}</b> siparişi gönderilmediği için iptal oldu. ${fmt(o.price)} iade edildi, 1 yıldız aldın.`);continue}
    out.push(`⏰ <b>${o.it.n}</b> hâlâ gönderilmedi! Bu akşam Kargo Masası'ndan göndermezsen sipariş iptal olur.`);keep.push(o)}
  S.ship=keep;return out}
function webMorning(){const out=[];for(const x of S.inv.filter(y=>y.web)){const ratio=x.web/Math.max(1,((x.known.expert&&x.fake)?x.worth:val(x))*trendMul(x));
    const p=clamp(.55-(ratio-1)*.7,.03,.7)*rateMul()*(1+.05*((S.up&&S.up.vitrin)||0));
    if(R()<p){const net=r10(x.web*(has('f3')?.95:.9));S.money+=net;S.inv=S.inv.filter(y=>y.id!==x.id);const pr=x.web;delete x.web;logT('web',x,net);stat('web');S.st.bestProfit=Math.max(S.st.bestProfit||0,net-x.paid);shipNew(x,pick(WNAMES),pr,'site');gainXP(12);
      out.push(`🛒 Web mağazandan <b>${x.n}</b> ${fmt(pr)} fiyatla satıldı. %${has('f3')?5:10} vergi sonrası ${fmt(net)} kasana girdi. <b>Bu akşam kargola!</b>`)}}
  return out}

    gear(c-60,c-50,95,28,'#d8a64a');gear(c+95,c+40,70,22,'#c9973f');gear(c-40,c+110,55,18,'#e0b860');gear(c+60,c-120,45,16,'#b88838');q.strokeStyle='#e0c080';q.lineWidth=6;q.beginPath();q.arc(c+20,c+150,40,0,7);q.stroke()}

  else if(o.sub){const n=o.sub,pos=n===2?[[-.38,.05],[.38,.05]]:[[-.38,.05],[.38,.05],[0,.4]];pos.forEach(([dx,dy])=>{q.strokeStyle=o.ink;q.lineWidth=3;q.beginPath();q.arc(c+dx*R,c+dy*R,R*.17,0,7);q.stroke();for(let i=0;i<12;i++){const a=i/12*P*2;q.beginPath();q.moveTo(c+dx*R+Math.cos(a)*R*.13,c+dy*R+Math.sin(a)*R*.13);q.lineTo(c+dx*R+Math.cos(a)*R*.17,c+dy*R+Math.sin(a)*R*.17);q.stroke()}})}

  q.textAlign='center';q.textBaseline='middle';const L=(i)=>{const a=i/12*P*2-P/2;return[c+Math.cos(a)*R*.66,c+Math.sin(a)*R*.66]};
  for(let i=0;i<12;i++){const[x,y]=L(i);if(o.sub&&(i===3||i===9))continue;if(o.moon&&i===6)continue;if(o.date&&i===3){continue}

  sc.style.zoom=SZ<1?SZ.toFixed(3):'';
  for(let i=0;i<2;i++){const over=m.scrollHeight-m.clientHeight;if(over<=1)break;const h=sc.getBoundingClientRect().height;
    SZ=Math.max(.55,SZ*(h-over)/h);sc.style.zoom=SZ.toFixed(3)}}
window.addEventListener('resize',()=>{clearTimeout(fitScene.t);fitScene.t=setTimeout(fitScene,120)});
function numPad(o){/* o:{label,value,max,onInput(v),onDone(v)} */
  const app=$('#app');if(!app)return;const old=$('.kp');if(old)old.remove();let v=o.value>0?String(Math.round(o.value)):'';
  const el=document.createElement('div');el.className='kp';el.setAttribute('role','dialog');el.setAttribute('aria-label',o.label||'Tutar');
  el.innerHTML=`<div class="kp-sh"><div class="kp-hd"><small>${o.label||'Tutar'}</small><button class="kp-x" data-k="x" aria-label="Kapat">✕</button></div>
   <div class="kp-v" id="kpV"></div><div class="kp-g">${['1','2','3','4','5','6','7','8','9','00','0','⌫'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}<button class="kp-ok" data-k="ok">Tamam</button></div></div>`;
  const paint=()=>{$('#kpV').innerHTML=v?fmt(+v):'<span class="ph">0 ₺</span>'};
  const close=(ok)=>{el.remove();if(ok&&o.onDone)o.onDone(v?+v:0)};
  el.addEventListener('click',e=>{e.stopPropagation();const b=e.target.closest('[data-k]');if(!b){if(e.target===el)close(true);return}
    const k=b.dataset.k;sfx.tap&&sfx.tap();
    if(k==='x'){close(false);return}if(k==='ok'){close(true);return}
    if(k==='⌫')v=v.slice(0,-1);else{v=(v+k).replace(/^0+/,'').slice(0,7)}
    paint();if(o.onInput)o.onInput(v?+v:0)});
  app.appendChild(el);paint()}
function typeOffer(){const c=S.cust;const lbl=c&&c.kind==='buyer'?'Fiyatın':'Teklifin';const prev=S.offer;
  numPad({label:lbl,value:S.offer,
    onInput:v=>{S.offer=v;const ov=$('#offerV');if(ov)ov.innerHTML=v>0?fmt(v):'<span class="ph">Tutar seç</span>';reactPreview()},
    onDone:v=>{S.offer=v>0?v:prev;save();render()}})}
function offerStart(){const c=S.cust;if(!c)return 100;if(c.kind==='seller')return r10(c.ask*.5);const it=itemById(c.itemId);return it?r10(Math.max(50,it.paid*1.1)):100}
function reactPreview(){const c=S.cust;if(screen!=='game'||S.tab!=='shop'||!c||c.done||(c.kind!=='seller'&&c.kind!=='buyer'))return;
  if(!(S.offer>0)&&!(S.cust&&S.cust.trade)){const el=$('.cust');if(el)el.innerHTML=avatar(c.seed,moodOf(c));const rx=$('#react');if(rx){rx.textContent='';rx.className='react'}return}
  if(c.fz==null)c.fz=rf(.92,1.08);const o=S.offer+(c.kind==='seller'&&c.trade?tradeValOf(c):0);let m,t,cls;
  if(c.kind==='seller'){if(o>=c.ask){m=1;t='Hemen!';cls='good'}else{const r=o/(c.minAccept*c.fz);
    if(r>=1){m=.75;t='Olur gibi…';cls='good'}else if(r>=.8){m=.15;t='Hmm…';cls='warn'}else if(r>=.45){m=-.45;t='Az bu!';cls='bad'}else{m=-1;t='Hıh!';cls='bad'}}}
  else{const it=itemById(c.itemId);if(!it)return;const knows=it.fake&&(it.known.expert||it.known.suspect);const cap=(c.honest&&knows)?it.appear*.33:c.maxPay;const r=o/(cap*c.fz);
    if(r<=.8){m=1;t='Kapış kapış!';cls='good'}else if(r<=1){m=.6;t='Olabilir';cls='good'}else if(r<=1.3){m=-.3;t='Pahalı…';cls='warn'}else{m=-1;t='Soygun bu!';cls='bad'}}
  const el=$('.cust');if(el)el.innerHTML=avatar(c.seed,m*.7+moodOf(c)*.3);
  if(has('z1')){let pc;if(c.kind==='seller')pc=o>=c.ask?100:o/(c.minAccept*c.fz)*100;else{const it2=itemById(c.itemId),kn=it2.fake&&(it2.known.expert||it2.known.suspect),cp=(c.honest&&kn)?it2.appear*.33:c.maxPay;pc=cp*c.fz/o*100}t+=' · %'+Math.min(100,Math.round(pc))}const rx=$('#react');if(rx&&rx.textContent!==t){rx.textContent=t;rx.className='react '+cls;void rx.offsetWidth;rx.classList.add('pop')}}
function intelHtml(it){
  if(it.chest)return '<div class="intel">Kilitli. İncelenemez. Ya şans ya hurda.</div>';
  const k=it.known;let s='';
  if(k.expert)s=`Uzman raporu: <b>${it.fake?'REPLİKA':'ORİJİNAL'}</b> · Gerçek değer <b>${fmt(it.fake?it.worth:it.appear)}</b> ${it.fake?'<span class="chip bad">Sahte</span>':'<span class="chip good">Orijinal</span>'}`;
  else if(k.insp)s=`Tahmini piyasa: <b>${fmt(k.lo)} – ${fmt(k.hi)}</b> · ${CONDN[it.cond-1]} ${k.suspect?'<span class="chip bad">Şüpheli damga</span>':'<span class="chip good">Temiz görünüyor</span>'}`;
  else s='Henüz incelemedin. Ürüne dokun, arkasını çevirip damgasına bak.';
  return `<div class="intel">${s}</div>`}

  if(S.tab==='shop')main.innerHTML=S.phase==='dayEnd'?renderEvening():renderScene()+renderPanel();

/* ---------- 3D thumbnails for icons ---------- */
const THUMBS=new Map();let TR=null;
function makeEnv(r){const T=THREE;const env=ctex(512,256,(g,W,H)=>{const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#fff0d0');gr.addColorStop(.35,'#c98a4a');gr.addColorStop(.55,'#1f4a42');gr.addColorStop(1,'#050c0b');g.fillStyle=gr;g.fillRect(0,0,W,H);
  g.fillStyle='rgba(255,250,235,.95)';g.fillRect(W*.15,H*.12,W*.12,H*.14);g.fillRect(W*.62,H*.08,W*.18,H*.1);g.fillStyle='rgba(120,220,200,.5)';g.fillRect(W*.4,H*.3,W*.08,H*.1)});
  env.mapping=T.EquirectangularReflectionMapping;const pm=new T.PMREMGenerator(r);const t=pm.fromEquirectangular(env).texture;pm.dispose();return t}
const thumbKey=it=>'v2|'+[it.k,it.cond,it.cert&&it.cert.auth?'c'+it.cert.grade+(it.id||''):'',it.pl?it.pl.seed:'',it.k==='atki'||it.k==='krampon'?hashStr(it.id||'')%TEAMS.length:''].join('|');
/* persistent thumbnail cache (IndexedDB) + background queue */
let TDB=null,TDBready=false;const TQ=new Map();let TQrun=false;
(function(){try{const rq=indexedDB.open('bitpazari-thumbs',1);rq.onupgradeneeded=()=>rq.result.createObjectStore('t');rq.onsuccess=()=>{TDB=rq.result;try{const tx=TDB.transaction('t','readonly'),st=tx.objectStore('t'),cur=st.openCursor();let n=0;
  cur.onsuccess=()=>{const c=cur.result;if(c){if(!THUMBS.has(c.key))THUMBS.set(c.key,c.value);n++;c.continue()}else{TDBready=true;if(n>900){try{TDB.transaction('t','readwrite').objectStore('t').clear()}catch(e){}}tqKick();thumbFill()}};cur.onerror=()=>{TDBready=true;tqKick()}}catch(e){TDBready=true;tqKick()}};rq.onerror=()=>{TDBready=true;tqKick()}}catch(e){TDBready=true}})();
setTimeout(()=>{if(!TDBready){TDBready=true;tqKick()}},1500);
function thumbPrewarm(){try{if(!window.THREE)return;const list=[...(S.inv||[])];if(S.lots&&S.lots.list)S.lots.list.forEach(l=>list.push(l.it));if(S.cust&&S.cust.item)list.push(S.cust.item);
  list.forEach(it=>{if(it&&!(it.k==='kart'&&it.pl))thumbAsync(it)})}catch(e){}}
setTimeout(thumbPrewarm,2500);setInterval(thumbPrewarm,20000);
function tdbPut(k,v){if(!TDB||!v)return;try{TDB.transaction('t','readwrite').objectStore('t').put(v,k)}catch(e){}}
const BLANK='data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==';
function thumbFill(){document.querySelectorAll('img.tico.pend').forEach(el=>{const u=THUMBS.get(el.dataset.tk);if(u){el.src=u;el.classList.remove('pend')}})}
function thumbAsync(it){const k=thumbKey(it);if(THUMBS.has(k))return THUMBS.get(k);if(!TQ.has(k))TQ.set(k,JSON.parse(JSON.stringify(it)));tqKick();return null}
function tqKick(){if(TQrun||!TDBready||!TQ.size)return;TQrun=true;setTimeout(tqStep,30)}
function tqStep(){const e=TQ.entries().next();if(e.done){TQrun=false;return}const [k,it]=e.value;TQ.delete(k);let u=THUMBS.get(k);if(u===undefined){u=thumbSync(it);if(u)tdbPut(k,u)}
  document.querySelectorAll(`img.tico.pend[data-tk="${k.replace(/"/g,'\\"')}"]`).forEach(el=>{if(u){el.src=u;el.classList.remove('pend')}});setTimeout(tqStep,TQ.size?24:0)}
function thumbURL(it){if(!window.THREE)return null;ensurePlayer(it);const k=thumbKey(it);if(THUMBS.has(k))return THUMBS.get(k);const u=thumbSync(it);if(u)tdbPut(k,u);return u}
function thumbSync(it){if(!window.THREE)return null;ensurePlayer(it);const key=thumbKey(it);
  if(THUMBS.has(key))return THUMBS.get(key);
  try{const T=THREE;if(!TR){const c=document.createElement('canvas');c.width=c.height=256;const r=new T.WebGLRenderer({canvas:c,antialias:true,alpha:true,preserveDrawingBuffer:true});r.setSize(256,256,false);
      r.outputEncoding=T.sRGBEncoding;r.toneMapping=T.ACESFilmicToneMapping;r.toneMappingExposure=1.2;const sc=new T.Scene();sc.environment=makeEnv(r);sc.add(new T.HemisphereLight('#ffe9c4','#0b1d1a',.6));
      const k=new T.DirectionalLight('#ffdcaa',2.2);k.position.set(2,4,5);sc.add(k);const rim=new T.DirectionalLight('#7fe0cf',1);rim.position.set(-4,2,-3);sc.add(rim);
      const cam=new T.PerspectiveCamera(28,1,.1,50);cam.position.set(0,.4,6.2);cam.lookAt(0,0,0);TR={r,sc,cam}}
    const inner=buildModel(Object.assign({},it,{known:{}}));const bb=new T.Box3().setFromObject(inner),sz=new T.Vector3(),ct=new T.Vector3();bb.getSize(sz);bb.getCenter(ct);
    inner.position.set(-ct.x,-ct.y,-ct.z);const m=new T.Group();m.add(inner);m.scale.setScalar(2.55/Math.max(sz.x,sz.y,sz.z*.9));m.rotation.set(.18,-.42,0);TR.sc.add(m);
    TR.r.setClearColor(0,0);TR.r.clear();TR.r.render(TR.sc,TR.cam);let url=TR.r.domElement.toDataURL('image/webp',.86);if(url.indexOf('image/webp')<0)url=TR.r.domElement.toDataURL('image/png');TR.sc.remove(m);

  catch(e){THUMBS.set(key,null);return null}}

/* ---------- dust motes ---------- */
const reduceMotion=(()=>{try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}})();
const motes=Array.from({length:38},()=>({x:Math.random(),y:Math.random(),r:.5+Math.random()*1.7,s:.00015+Math.random()*.0004,p:Math.random()*6.28}));
function dustLoop(t){const cv=document.getElementById('dust');
  if(cv&&!reduceMotion){const dpr=Math.min(2,window.devicePixelRatio||1),w=cv.clientWidth,h=cv.clientHeight;
    if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
    const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,w,h);
    for(const m of motes){m.y-=m.s;m.x+=Math.sin(t/2400+m.p)*.00025;if(m.y<-.02){m.y=1.02;m.x=Math.random()}
      const dx=Math.min(Math.abs(m.x-.2),Math.abs(m.x-.8)),light=Math.max(0,1-Math.hypot(dx*1.6,(m.y-.25)*1.3));
      const a=(.15+.55*light)*(.6+.4*Math.sin(t/600+m.p*3));
      g.beginPath();g.arc(m.x*w,m.y*h,m.r,0,6.283);g.fillStyle=`rgba(255,214,150,${a.toFixed(3)})`;g.fill()}}
  requestAnimationFrame(dustLoop)}
requestAnimationFrame(dustLoop);
