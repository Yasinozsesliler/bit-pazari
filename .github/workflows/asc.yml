name: App Store Connect işlemleri

on:
  push:
    branches: [asc]

jobs:
  asc:
    runs-on: ubuntu-latest
    env:
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_ID: 6328BZ8U27
      ASC_ISSUER_ID: 92538e79-b529-4f31-b67e-b78ad2429c3d
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pyjwt cryptography requests
      - name: ASC
        run: |
          printf '%s' "$ASC_KEY_P8" > $RUNNER_TEMP/k.p8
          KEYFILE=$RUNNER_TEMP/k.p8 python3 tools/asc/asc.py
